<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Нет подключения — IK-HOUSE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 30px -15px rgba(15, 23, 42, .15);
    }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: grid; place-items: center;
    }
    .logo svg { width: 40px; height: 40px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    p { color: #475569; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; width: 100%;
      background: #2563eb; color: #fff;
      border: 0; border-radius: 14px;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 512 512" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
        <path d="M132 264 L256 152 L380 264"/>
        <path d="M168 246 V352 a16 16 0 0 0 16 16 h144 a16 16 0 0 0 16-16 V246"/>
        <path d="M150 408 q26 -20 53 0 t53 0 t53 0 t53 0" stroke="#93c5fd" stroke-width="26"/>
      </svg>
    </div>
    <h1>Нет подключения к интернету</h1>
    <p>IK-HOUSE сейчас не может загрузить новые данные. Проверьте соединение и попробуйте снова.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
